<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0a">
<title>Scrimmage Pro</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#090a0a;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,select,input{font:inherit}button{cursor:pointer}
.app{max-width:1600px;margin:auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292b2b;padding-bottom:12px}
.kicker{font-size:10px;letter-spacing:2px;color:#888;font-weight:800}h1{font-size:24px;margin:3px 0}
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 0;flex-wrap:wrap}
.mode{display:flex;border:1px solid #292b2b;border-radius:8px;padding:3px}.mode button{border:0;background:transparent;color:#888;padding:7px 11px;border-radius:6px;font-weight:800}.mode .active{background:#f5f5f5;color:#111}
.btn,.set{border:1px solid #292b2b;background:#161818;color:#ddd;border-radius:7px;padding:7px 10px;font-weight:800}.danger{color:#f47777}.spacer{flex:1}
.scrim{display:grid;grid-template-columns:1fr 1fr;gap:12px}.scrim.single{grid-template-columns:1fr}
.team{min-width:0;background:#121414;border:1px solid #292b2b;border-radius:12px;overflow:hidden}
.teamHead{display:flex;justify-content:space-between;align-items:center;background:#181a1a;border-bottom:1px solid #292b2b;padding:10px 12px}.teamName{font-size:17px;font-weight:900}.head{display:flex;gap:5px}.icon{border:0;background:transparent;color:#999;padding:5px;font-weight:900}
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:9px}.metric{background:#181a1a;border:1px solid #242626;border-radius:7px;text-align:center;padding:7px 3px}.metric label{display:block;color:#777;font-size:8px;letter-spacing:1px;font-weight:800}.metric b{font-size:20px;display:block;margin-top:2px}
.sets{display:flex;gap:6px;overflow:auto;padding:0 9px 9px}.set{white-space:nowrap;font-size:9px;padding:6px 9px}.set.active{background:#f5f5f5;color:#111;border-color:#fff}.add{border-style:dashed}
.calls{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:0 9px 9px}.call{border:0;border-radius:8px;color:#fff;min-height:68px;font-size:24px;font-weight:950}.call small{display:block;font-size:7px;letter-spacing:.5px;margin-top:3px;opacity:.8}.c3{background:#00bd66}.c2{background:#00a94d}.c1{background:#536785}.m2{background:#df0013}.m3{background:#a40042}.to{background:#ed8500}
.history{border-top:1px solid #292b2b;background:#101212}.historyHead{display:flex;justify-content:space-between;padding:8px 10px}.historyHead b{font-size:10px;letter-spacing:1px}.historyHead span{font-size:8px;color:#777}.undo{border:0;background:transparent;color:#aaa;font-weight:800;font-size:9px}.scroll{max-height:180px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-top:1px solid #202222;font-size:9px}th{font-size:7px;color:#666;text-align:left}td:nth-child(n+3),th:nth-child(n+3){text-align:right}.badge{display:inline-block;min-width:27px;text-align:center;border-radius:4px;padding:3px 4px;font-weight:900}.b3{background:#006c3e}.b2{background:#00652f}.b1{background:#354660}.bm2{background:#700008}.bm3{background:#650028}.bto{background:#864700}.good{color:#2bd786}.bad{color:#ff6270}.empty{text-align:center;color:#666;padding:20px}
.insights{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:8px}.insight{background:#161818;border:1px solid #222424;border-radius:7px;padding:7px}.insight h3{margin:0 0 5px;font-size:7px;letter-spacing:1px;color:#777}.line{display:flex;justify-content:space-between;font-size:9px;padding:2px 0}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.dialog{width:min(420px,100%);background:#171919;border:1px solid #333;border-radius:12px;padding:16px}.dialog h3{margin:0 0 10px}.dialog input{width:100%;background:#0d0e0e;color:#fff;border:1px solid #333;border-radius:7px;padding:10px;margin-bottom:10px}.dialog .row{display:flex;justify-content:flex-end;gap:7px}.dialog button{border:0;border-radius:7px;padding:9px 13px;font-weight:900}.save{background:#f5f5f5;color:#111}.cancel{background:#292b2b;color:#ddd}
@media(max-width:850px){.scrim{grid-template-columns:1fr}.team:nth-child(2){display:none}.metrics{grid-template-columns:repeat(3,1fr)}.calls{grid-template-columns:repeat(3,1fr)}.call{min-height:78px}.spacer{display:none}}
</style>
</head>
<body>
<div class="app">
<header><div><div class="kicker">LIVE SCRIMMAGE PRO</div><h1 id="title">Practice</h1></div><div><button class="btn" id="rename">✎ Nimi</button> <button class="btn" id="csv">↓ CSV</button> <button class="btn danger" id="reset">↻ RESET</button></div></header>
<div class="toolbar"><div class="mode"><button id="one">1 JOUKKUE</button><button id="two" class="active">2 JOUKKUET</button></div><b style="font-size:9px;color:#777">ERÄ</b><select id="period"><option>1</option><option>2</option><option>3</option><option>4</option><option>OT</option></select><button class="btn" id="clock">12:00</button><div class="spacer"></div><button class="btn" id="summary">↓ SUMMARY</button></div>
<main id="scrim" class="scrim"></main>
</div>
<div id="modal" class="modal"><div class="dialog"><h3 id="mtitle">Muokkaa</h3><input id="input"><div class="row"><button class="cancel" id="cancel">Peruuta</button><button class="save" id="save">Tallenna</button></div></div></div>
<script>
(function(){
"use strict";
var KEY="scrimmage_pro_clean_v1";
var TYPES={
 "3pm":{label:"3PT Make",short:"+3",pts:3,cls:"b3"},
 "2pm":{label:"2PT Make",short:"+2",pts:2,cls:"b2"},
 "1":{label:"FT Make",short:"+1",pts:1,cls:"b1"},
 "2miss":{label:"2PT Miss",short:"MISS",pts:null,cls:"bm2"},
 "3miss":{label:"3PT Miss",short:"MISS",pts:null,cls:"bm3"},
 "to":{label:"Turnover",short:"TO",pts:null,cls:"bto"}
};
function newPlays(){return ["HORNS 2","IVERSON","RAM","PHILLY","SLICE"].map(function(n){return {name:n,items:[]};});}
var state;
try{state=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){state=null;}
if(!state||!state.teams||state.teams.length!==2){
 state={title:"Practice",mode:"two",period:"1",teams:[{name:"BLUE",plays:newPlays()},{name:"WHITE",plays:newPlays()}],active:[0,0],clock:720};
}
if(!state.active)state.active=[0,0];
if(typeof state.clock!=="number")state.clock=720;
var editFn=null,timer=null;

function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function stats(team){
 var a=[];
 team.plays.forEach(function(p){a=a.concat(p.items);});
 var pts=0,shots=0,makes=0;
 a.forEach(function(x){pts+=x.pts||0;if(x.type==="3pm"||x.type==="2pm"||x.type==="3miss"||x.type==="2miss"){shots++;if(x.pts!==null)makes++;}});
 return {a:a,pts:pts,poss:a.length,ppp:a.length?pts/a.length:0,fg:shots?100*makes/shots:0};
}
function playStats(p){
 var a=p.items,pts=0,shots=0,makes=0;
 a.forEach(function(x){pts+=x.pts||0;if(x.type==="3pm"||x.type==="2pm"||x.type==="3miss"||x.type==="2miss"){shots++;if(x.pts!==null)makes++;}});
 return {poss:a.length,pts:pts,ppp:a.length?pts/a.length:0,fg:shots?100*makes/shots:0};
}
function openModal(title,value,fn){editFn=fn;document.getElementById("mtitle").textContent=title;document.getElementById("input").value=value;document.getElementById("modal").className="modal open";setTimeout(function(){document.getElementById("input").focus();document.getElementById("input").select();},20);}
function addEvent(ti,type){var p=state.teams[ti].plays[state.active[ti]];p.items.push({type:type,pts:TYPES[type].pts,period:state.period,time:state.clock});save();render();}
function makeTeam(ti){
 var t=state.teams[ti],s=stats(t),pi=state.active[ti],p=t.plays[pi],ps=playStats(p);
 var el=document.createElement("section");el.className="team";
 el.innerHTML='<div class="teamHead"><span class="teamName">'+esc(t.name)+'</span><div class="head"><button class="icon" data-name>✎</button><button class="icon" data-undo>↩</button><button class="icon" data-clear>RESET</button></div></div>'+
 '<div class="metrics"><div class="metric"><label>PTS</label><b>'+s.pts+'</b></div><div class="metric"><label>POSS</label><b>'+s.poss+'</b></div><div class="metric"><label>PPP</label><b>'+s.ppp.toFixed(2)+'</b></div><div class="metric"><label>FG%</label><b>'+s.fg.toFixed(1)+'%</b></div><div class="metric"><label>3PM</label><b>'+s.a.filter(function(x){return x.type==="3pm";}).length+'</b></div><div class="metric"><label>TO</label><b>'+s.a.filter(function(x){return x.type==="to";}).length+'</b></div></div>'+
 '<div class="sets" data-sets></div>'+
 '<div class="calls"><button class="call c3" data-t="3pm">+3<small>3PT MAKE</small></button><button class="call c2" data-t="2pm">+2<small>2PT MAKE</small></button><button class="call c1" data-t="1">+1<small>FT MAKE</small></button><button class="call m2" data-t="2miss">MISS<small>2PT MISS</small></button><button class="call m3" data-t="3miss">MISS<small>3PT MISS</small></button><button class="call to" data-t="to">TO<small>TURNOVER</small></button></div>'+
 '<div class="history"><div class="historyHead"><div><b>'+esc(t.name)+' · '+esc(p.name)+'</b><span> '+ps.poss+' poss · '+ps.ppp.toFixed(2)+' PPP</span></div><button class="undo" data-undo>↩ UNDO</button></div><div class="scroll"><table><thead><tr><th>#</th><th>RESULT</th><th>PTS</th><th>TOTAL</th><th>PPP</th></tr></thead><tbody data-rows></tbody></table></div></div>'+
 '<div class="insights"><div class="insight"><h3>SET</h3><div class="line"><span>PPP</span><b>'+ps.ppp.toFixed(2)+'</b></div><div class="line"><span>FG%</span><b>'+ps.fg.toFixed(0)+'%</b></div></div><div class="insight"><h3>BEST SETS</h3><div data-best></div></div></div>';
 var sets=el.querySelector("[data-sets]");
 t.plays.forEach(function(x,i){var b=document.createElement("button");b.className="set"+(i===pi?" active":"");b.textContent=x.name;b.onclick=function(){state.active[ti]=i;save();render();};b.ondblclick=function(){openModal("Setin nimi",x.name,function(v){x.name=v;});};sets.appendChild(b);});
 var ab=document.createElement("button");ab.className="set add";ab.textContent="+";ab.onclick=function(){t.plays.push({name:"NEW PLAY",items:[]});state.active[ti]=t.plays.length-1;save();render();openModal("Setin nimi","NEW PLAY",function(v){t.plays[state.active[ti]].name=v;save();render();});};sets.appendChild(ab);
 el.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){addEvent(ti,b.getAttribute("data-t"));};});
 el.querySelectorAll("[data-undo]").forEach(function(b){b.onclick=function(){if(p.items.length){p.items.pop();save();render();}};});
 el.querySelector("[data-clear]").onclick=function(){if(confirm("Tyhjennetäänkö tämän joukkueen kaikki kirjaukset?")){t.plays.forEach(function(x){x.items=[];});save();render();}};
 el.querySelector("[data-name]").onclick=function(){openModal("Joukkueen nimi",t.name,function(v){t.name=v;});};
 var rows=el.querySelector("[data-rows]");
 if(!p.items.length)rows.innerHTML='<tr><td colspan="5" class="empty">Ei vielä kirjauksia.</td></tr>';
 else{var total=0;p.items.forEach(function(x,i){total+=x.pts||0;var avg=total/(i+1),tr=document.createElement("tr");tr.innerHTML='<td>'+(i+1)+'</td><td><span class="badge '+TYPES[x.type].cls+'">'+TYPES[x.type].short+'</span> '+TYPES[x.type].label+'</td><td class="'+(x.pts!==null?"good":"bad")+'">'+(x.pts!==null?"+"+x.pts:"—")+'</td><td>'+total+'</td><td>'+avg.toFixed(2)+'</td>';rows.prepend(tr);});}
 var best=t.plays.map(function(x){var z=playStats(x);return {name:x.name,ppp:z.ppp,poss:z.poss,fg:z.fg};}).filter(function(x){return x.poss>0;}).sort(function(a,b){return b.ppp-a.ppp;}).slice(0,3);
 el.querySelector("[data-best]").innerHTML=best.length?best.map(function(x){return '<div class="line"><span>'+esc(x.name)+'</span><b>'+x.ppp.toFixed(2)+'</b></div>';}).join(""):'<span style="color:#666;font-size:8px">Ei dataa</span>';
 return el;
}
function render(){
 document.getElementById("title").textContent=state.title;
 document.getElementById("one").className=state.mode==="one"?"active":"";
 document.getElementById("two").className=state.mode==="two"?"active":"";
 document.getElementById("period").value=state.period;
 var root=document.getElementById("scrim");root.innerHTML="";root.className="scrim"+(state.mode==="one"?" single":"");root.appendChild(makeTeam(0));if(state.mode==="two")root.appendChild(makeTeam(1));
 document.getElementById("clock").textContent=fmt(state.clock);
}
function fmt(n){var m=Math.floor(n/60),s=n%60;return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}
document.getElementById("one").onclick=function(){state.mode="one";save();render();};
document.getElementById("two").onclick=function(){state.mode="two";save();render();};
document.getElementById("period").onchange=function(e){state.period=e.target.value;save();};
document.getElementById("rename").onclick=function(){openModal("Harjoituksen nimi",state.title,function(v){state.title=v;});};
document.getElementById("cancel").onclick=function(){document.getElementById("modal").className="modal";};
document.getElementById("save").onclick=function(){var v=document.getElementById("input").value.trim();if(v&&editFn)editFn(v);save();document.getElementById("modal").className="modal";render();};
document.getElementById("reset").onclick=function(){if(confirm("Tyhjennetäänkö koko harjoitus?")){state.teams.forEach(function(t){t.plays.forEach(function(p){p.items=[];});});state.clock=720;save();render();}};
document.getElementById("clock").onclick=function(){if(timer){clearInterval(timer);timer=null;}else{timer=setInterval(function(){if(state.clock>0){state.clock--;document.getElementById("clock").textContent=fmt(state.clock);}else{clearInterval(timer);timer=null;}},1000);}};
function download(name,text,type){var a=document.createElement("a"),b=new Blob([text],{type:type});a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},500);}
document.getElementById("csv").onclick=function(){var rows=[["Team","Period","Play","Possession","Result","Points"]];state.teams.forEach(function(t){t.plays.forEach(function(p){p.items.forEach(function(x,i){rows.push([t.name,x.period,p.name,i+1,TYPES[x.type].label,x.pts===null?"":x.pts]);});});});download("scrimmage.csv",rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(",");}).join("\n"),"text/csv");};
document.getElementById("summary").onclick=function(){var out=[state.title,""];state.teams.forEach(function(t){var s=stats(t);out.push(t.name+" | "+s.pts+" PTS | "+s.poss+" POSS | "+s.ppp.toFixed(2)+" PPP | "+s.fg.toFixed(1)+" FG%");t.plays.forEach(function(p){var z=playStats(p);if(z.poss)out.push("  "+p.name+" | "+z.poss+" poss | "+z.ppp.toFixed(2)+" PPP | "+z.fg.toFixed(0)+" FG%");});out.push("");});download("scrimmage-summary.txt",out.join("\n"),"text/plain");};
document.addEventListener("keydown",function(e){if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;var map={"3":"3pm","2":"2pm","1":"1","m":"2miss","q":"3miss","t":"to"};if(map[e.key.toLowerCase()])addEvent(0,map[e.key.toLowerCase()]);});
save();render();
})();
</script>
</body>
</html>
